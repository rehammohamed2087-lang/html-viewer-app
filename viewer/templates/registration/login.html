{% extends "viewer/base.html" %}
{% block title %}دخول الأدمن{% endblock %}
{% block content %}
<div class="wrap">
  <div class="lockbox" style="text-align:right">
    <h1>دخول الأدمن</h1>
    <form method="post" style="display:block">
      {% csrf_token %}
      {% if form.errors %}<p class="errorlist">اسم المستخدم أو كلمة المرور غير صحيحة، أو الحساب ليس أدمن.</p>{% endif %}
      <label>اسم المستخدم {{ form.username }}</label>
      <label>كلمة المرور {{ form.password }}</label>
      <button class="btn" style="width:100%">دخول</button>
    </form>
  </div>
</div>
{% endblock %}
